<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rusticando · Panel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --coal:#16130f; --dust:#efe6d6; --paper:#f7f1e6; --pine:#e3a33f; --mark:#c8442b; --ok:#1f7a45;
  --ink:#16130f; --muted:#6d6153; --line:rgba(22,19,15,.18);
  --display:"Big Shoulders Display",Impact,sans-serif; --mono:"Space Mono",ui-monospace,monospace; --sans:"Archivo",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--dust);color:var(--ink);font:16px/1.5 var(--sans)}
[hidden]{display:none!important}
.wrap{width:min(1000px,100% - 32px);margin-inline:auto}
header{background:var(--coal);color:var(--dust)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.logo{font:900 1.5rem var(--display);letter-spacing:.04em}
.logo b{color:var(--pine)}
.logo small{font:700 .7rem var(--mono);text-transform:uppercase;color:#a89a87;margin-left:10px;letter-spacing:.06em}
.mono{font:700 .75rem var(--mono);text-transform:uppercase;letter-spacing:.04em}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;margin:0}
h1{font-size:clamp(2.4rem,7vw,3.6rem)}
h2{font-size:1.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;font:700 .78rem var(--mono);text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--ink);background:var(--ink);color:var(--dust);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pine);color:var(--ink)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.ghost:hover{background:var(--dust);color:var(--ink)}
.btn.danger{background:var(--mark);border-color:var(--mark);color:#fff}
.btn.small{padding:7px 10px;font-size:.7rem}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.panel{background:var(--paper);border:1.5px solid var(--ink);padding:clamp(18px,4vw,32px)}
label{display:flex;flex-direction:column;gap:6px;font:700 .72rem var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
input,select{font:400 1rem var(--sans);color:var(--ink);padding:11px 12px;border:1.5px solid var(--ink);background:#fff;border-radius:0;width:100%}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--ink)}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink)}
.msg{padding:10px 12px;border:1.5px solid var(--ink);font-size:.95rem}
.msg.err{background:#f6d9d2;border-color:var(--mark)}
.msg.ok{background:#d9eedd;border-color:var(--ok)}

/* Login */
#login{max-width:420px;margin:12vh auto 40px}
#login form{display:grid;gap:16px;margin-top:20px}

/* Dashboard */
.bar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:36px 0 20px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.bar p{margin:6px 0 0;color:var(--muted)}
.list{display:grid;gap:10px;margin-bottom:60px}
.row{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1.5px solid var(--ink);padding:10px}
.row.off{opacity:.55}
.thumb{width:72px;height:72px;object-fit:cover;background:#c89a68;display:block}
.row h3{margin:0;font:800 1.3rem/1.05 var(--display);text-transform:uppercase}
.row .meta{color:var(--muted);font-size:.85rem;margin-top:3px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;font:700 .62rem var(--mono);text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;margin-left:6px;vertical-align:2px}
@media (max-width:620px){.row{grid-template-columns:60px 1fr}.thumb{width:60px;height:60px}.row .acts{grid-column:1/-1;justify-content:flex-start}}

/* Form */
#editor{margin:30px 0 60px}
#editor form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
#editor .full{grid-column:1/-1}
.preview{display:flex;gap:12px;align-items:center}
.preview img,.preview video{width:120px;height:120px;object-fit:cover;border:1.5px solid var(--ink);background:#c89a68}
.hint{font:400 .82rem var(--sans);color:var(--muted);text-transform:none;letter-spacing:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:620px){#editor form{grid-template-columns:1fr}}
.setup{max-width:640px;margin:12vh auto}
.setup code{font-family:var(--mono);background:#fff;padding:1px 5px;border:1px solid var(--line)}
</style>
</head>
<body>
<header><div class="wrap">
  <span class="logo">RUSTI<b>CANDO</b><small>Panel</small></span>
  <div style="display:flex;gap:8px">
    <a class="btn ghost small" href="../" style="color:var(--dust)">Ver la web</a>
    <button class="btn ghost small" id="logout" style="color:var(--dust)" hidden>Salir</button>
  </div>
</div></header>

<main class="wrap">
  <!-- Missing configuration -->
  <section id="setup" class="panel setup" hidden>
    <h2>Falta conectar la base de datos</h2>
    <p>Completá <code>js/config.js</code> con la dirección y la clave pública de Supabase. Los pasos están en <code>supabase/LEEME.md</code>.</p>
  </section>

  <!-- Login -->
  <section id="login" class="panel" hidden>
    <span class="mono" style="color:var(--mark)">Acceso privado</span>
    <h1>Ingresar</h1>
    <form id="login-form" autocomplete="on">
      <label>Correo<input id="email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="password" type="password" autocomplete="current-password" required minlength="8"></label>
      <div id="login-msg" class="msg err" role="alert" hidden></div>
      <button class="btn" id="login-btn" type="submit">Entrar</button>
    </form>
  </section>

  <!-- Catalog manager -->
  <section id="dash" hidden>
    <div class="bar">
      <div><h1>Tus piezas</h1><p>Lo que cargues acá aparece en el catálogo de la web en el momento.</p></div>
      <button class="btn" id="new-btn">+ Nueva pieza</button>
    </div>
    <div id="dash-msg" class="msg" role="status" hidden></div>
    <div id="editor" class="panel" hidden>
      <h2 id="editor-title">Nueva pieza</h2>
      <form id="piece-form">
        <label class="full">Nombre *<input id="f-name" required maxlength="80" placeholder="Ej.: Ratona en ciprés"></label>
        <label>Tipo
          <select id="f-category">
            <option value="ratona">Mesa ratona</option>
            <option value="barra">Barra · mesada</option>
            <option value="rack">Rack TV</option>
            <option value="mesa">Mesa</option>
            <option value="otro">Otro</option>
          </select>
        </label>
        <label>Madera<input id="f-wood" maxlength="60" placeholder="Ej.: Ciprés"></label>
        <label>Espesor<input id="f-thickness" maxlength="30" placeholder='Ej.: 2"'></label>
        <label>Medida<input id="f-size" maxlength="40" placeholder="Ej.: 1,30 × 0,85 m"></label>
        <label>Detalle<input id="f-detail" maxlength="60" placeholder="Ej.: Borde vivo"></label>
        <label>Precio<input id="f-price" maxlength="30" placeholder="Ej.: $5.900 o a medida"><span class="hint">Si empieza con $, se muestra como precio.</span></label>
        <label>Orden<input id="f-sort" type="number" min="0" max="9999" value="100"><span class="hint">Los números más bajos salen primero.</span></label>
        <label class="check"><input id="f-visible" type="checkbox" checked> Mostrar en la web</label>
        <label class="full">Foto<input id="f-image" type="file" accept="image/jpeg,image/png,image/webp"><span class="hint">Se achica sola para que la web cargue rápido.</span></label>
        <label class="full">Video (opcional)<input id="f-video" type="file" accept="video/mp4"><span class="hint">MP4 de hasta 25 MB. Se reproduce en loop y sin sonido.</span></label>
        <div class="full preview" id="preview"></div>
        <div id="form-msg" class="full msg err" role="alert" hidden></div>
        <div class="full actions">
          <button class="btn" id="save-btn" type="submit">Guardar</button>
          <button class="btn ghost" id="cancel-btn" type="button">Cancelar</button>
        </div>
      </form>
    </div>
    <div id="list" class="list"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="../js/config.js"></script>
<script src="admin.js"></script>
</body>
</html>
